<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>why do you hate sticks?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            user-select: none;
        }

        .green-3d-text {
            font-weight: 900;
            color: #2ecc71;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-shadow: 
                0 1px 0 #27ae60,
                0 2px 0 #27ae60,
                0 3px 0 #1e8449,
                0 4px 0 #1e8449,
                0 5px 0 #145a32,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(46, 204, 113, 0.3);
        }

        .green-3d-text-slim {
            font-weight: 900;
            color: #2ecc71;
            letter-spacing: 1px;
            text-shadow: 
                0 1px 0 #27ae60,
                0 2px 0 #1e8449,
                0 3px 1px rgba(0,0,0,.2),
                0 0 4px rgba(0,0,0,.1),
                0 3px 8px rgba(46, 204, 113, 0.25);
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            animation: fadeIn 0.3s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        .main-title {
            font-size: 42px;
            margin: 0 0 40px 0;
            text-align: center;
            padding: 0 20px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 240px;
        }

        .btn-green-border {
            padding: 16px 0;
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            background-color: #1a1a1a;
            border: 2px solid #2ecc71;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .btn-green-border:hover {
            background-color: #2ecc71;
            color: #121212;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(46, 204, 113, 0.4);
        }

        .stage-select-header {
            position: relative;
            width: 90%;
            max-width: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .back-btn {
            position: absolute;
            left: 0;
            background-color: #1a1a1a;
            border: 2px solid #2ecc71;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background-color: #2ecc71;
            color: #121212;
            transform: translateX(-3px);
        }

        .stages-title {
            font-size: 52px;
            margin: 0;
        }

        .stage-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 550px;
            max-height: 55vh;
            overflow-y: auto;
            padding: 10px;
        }

        .stage-box {
            position: relative;
            width: 75px;
            height: 75px;
            background-color: #1a1a1a;
            border: 2px solid #2ecc71;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .stage-box.unlocked:hover {
            background-color: #2ecc71;
            transform: scale(1.08);
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
        }

        .stage-box.unlocked:hover .green-3d-text-slim {
            color: #121212;
            text-shadow: 0 1px 0 #000000;
        }

        .stage-box.locked {
            border-color: #444;
            background-color: #141414;
            cursor: pointer;
        }

        .stage-box.locked .green-3d-text-slim {
            opacity: 0.2;
            text-shadow: none;
            color: #666;
        }

        .lock-icon {
            position: absolute;
            font-size: 24px;
            color: #ff4d4d;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .lock-msg {
            height: 25px;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #ff4d4d;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lock-msg.show {
            opacity: 1;
        }

        .stage-grid::-webkit-scrollbar {
            width: 8px;
        }
        .stage-grid::-webkit-scrollbar-thumb {
            background: #222;
            border: 1px solid #2ecc71;
            border-radius: 4px;
        }

        .game-title {
            font-size: 48px;
            margin: 0 0 10px 0;
        }

        .game-desc {
            color: #ccc;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .gauge-container {
            position: relative;
            width: 70vw;
            max-width: 900px;
            min-width: 320px;
            height: 55px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            background-color: #ff4d4d;
            border: 2px solid #2ecc71;
            cursor: pointer;
        }

        .zone-group {
            position: absolute;
            top: 0;
            height: 100%;
            width: 40%;
            display: flex;
            align-items: center;
            will-change: left;
            transition: left 0.29s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .green-zone {
            height: 100%;
            width: 50%;
            background-color: #2ecc71;
        }

        .yellow-left, .yellow-right {
            height: 100%;
            width: 25%;
            background-color: #ffcc00;
        }

        .pointer {
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background-color: #ffffff;
            box-shadow: 0 0 10px #ffffff, 0 0 5px #000000;
            transform: translateX(-50%);
            z-index: 10;
            will-change: left;
        }

        .status-info {
            margin-top: 20px;
            font-size: 18px;
            color: #aaa;
        }

        .result {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            height: 35px;
        }

        .game-btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .game-start-btn {
            width: 200px;
        }

        .next-stage-btn {
            width: 200px;
            display: none;
            background-color: #2ecc71;
            color: #121212;
        }

        .next-stage-btn:hover {
            background-color: #27ae60;
            color: #ffffff;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background-color: #121212;
            border: 2px solid #2ecc71;
            border-radius: 8px;
            padding: 30px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.3);
        }

        .modal-content h2 {
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .modal-content p {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. 메인 메뉴 화면 -->
    <div class="screen active" id="menuScreen">
        <h1 class="main-title green-3d-text">why do you hate sticks?</h1>
        <div class="menu-buttons">
            <button class="btn-green-border" onclick="showStages()">PLAY</button>
            <button class="btn-green-border" onclick="openModal('howToPlay')">HOW TO PLAY</button>
            <button class="btn-green-border" onclick="openModal('donate')">DONATE</button>
        </div>
    </div>

    <!-- 2. 스테이지 선택 화면 -->
    <div class="screen" id="stageSelectScreen">
        <div class="stage-select-header">
            <button class="back-btn" onclick="showScreen('menuScreen')">← back</button>
            <h1 class="stages-title green-3d-text">stages</h1>
        </div>
        <div class="stage-grid" id="stageGrid"></div>
        <div class="lock-msg" id="lockMsg">잠김!</div>
    </div>

    <!-- 3. 인게임 화면 -->
    <div class="screen" id="gameScreen">
        <div class="stage-select-header" style="justify-content: flex-start;">
            <button class="back-btn" onclick="showStages()">← back</button>
        </div>
        <h1 class="game-title green-3d-text" id="gameTitle">stage 1</h1>
        <p class="game-desc" id="gameDesc">바가 <b>초록색 영역</b>을 지나치기 전에 [스페이스바] 또는 [클릭]하세요!</p>

        <div class="gauge-container" id="gauge">
            <div class="zone-group" id="zoneGroup">
                <div class="yellow-left" id="yellowLeft"></div>
                <div class="green-zone" id="greenZone"></div>
                <div class="yellow-right" id="yellowRight"></div>
            </div>
            <div class="pointer" id="pointer"></div>
        </div>

        <div class="status-info" id="statusInfo">속도: 1.0x</div>
        <div class="result" id="result">게임 준비</div>
        
        <div class="game-btn-group">
            <button class="btn-green-border game-start-btn" id="startBtn" onclick="startGame()">START</button>
            <button class="btn-green-border next-stage-btn" id="nextBtn" onclick="nextStage()">NEXT STAGE</button>
        </div>
    </div>

    <!-- 모달 -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <h2 class="green-3d-text" id="modalTitle">TITLE</h2>
            <p id="modalBody">Description text goes here.</p>
            <button class="btn-green-border" style="width: 100%; padding: 10px 0;" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <script>
        const screens = document.querySelectorAll('.screen');
        const stageGrid = document.getElementById('stageGrid');
        const lockMsg = document.getElementById('lockMsg');
        const infoModal = document.getElementById('infoModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        const gauge = document.getElementById('gauge');
        const pointer = document.getElementById('pointer');
        const zoneGroup = document.getElementById('zoneGroup');
        const greenZone = document.getElementById('greenZone');
        const resultDisplay = document.getElementById('result');
        const statusInfo = document.getElementById('statusInfo');
        const startBtn = document.getElementById('startBtn');
        const nextBtn = document.getElementById('nextBtn');
        const gameTitle = document.getElementById('gameTitle');
        const gameDesc = document.getElementById('gameDesc');

        let currentStage = 1;
        let unlockedStage = parseInt(localStorage.getItem('react_green_unlocked') || '1');
        
        let position = 0;
        let direction = 1;
        let speed = 0.4025; // 15% 증가된 속도 유지
        
        let animationFrameId = null;
        let isPlaying = false;
        
        let zoneGroupPos = 30;

        let lockTimer = null;
        let currentSuccessCount = 0;
        let targetSuccessCount = 1;

        function initStageGrid() {
            unlockedStage = parseInt(localStorage.getItem('react_green_unlocked') || '1');
            stageGrid.innerHTML = '';
            for (let i = 1; i <= 50; i++) {
                const box = document.createElement('div');
                box.className = 'stage-box';
                
                const isUnlocked = i <= unlockedStage;
                
                const numText = document.createElement('span');
                numText.className = 'green-3d-text-slim';
                numText.textContent = i;
                box.appendChild(numText);

                if (isUnlocked) {
                    box.classList.add('unlocked');
                    box.onclick = () => selectStage(i);
                } else {
                    box.classList.add('locked');
                    
                    const lockIcon = document.createElement('span');
                    lockIcon.className = 'lock-icon';
                    lockIcon.textContent = '🔒';
                    box.appendChild(lockIcon);

                    box.onclick = () => handleLockedClick(box);
                }
                
                stageGrid.appendChild(box);
            }
        }

        function handleLockedClick(element) {
            element.classList.remove('shake');
            void element.offsetWidth;
            element.classList.add('shake');

            lockMsg.classList.add('show');
            if (lockTimer) clearTimeout(lockTimer);
            lockTimer = setTimeout(() => {
                lockMsg.classList.remove('show');
            }, 1000);
        }

        function showScreen(screenId) {
            if (isPlaying) {
                isPlaying = false;
                cancelAnimationFrame(animationFrameId);
            }
            screens.forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showStages() {
            initStageGrid();
            showScreen('stageSelectScreen');
        }

        function selectStage(stageNum) {
            setupStage(stageNum);
            showScreen('gameScreen');
        }

        function openModal(type) {
            if (type === 'howToPlay') {
                modalTitle.textContent = "how to play";
                modalBody.innerHTML = "움직이는 흰색 바가 <b>초록색 구간</b>을 지나가기 전에 누르세요!<br><br>놓치면 <b>실패</b>합니다!";
            } else if (type === 'donate') {
                modalTitle.textContent = "donate";
                modalBody.innerHTML = "why do you hate sticks?를 플레이해주셔서 감사합니다! ❤️<br><br>후원 기능은 준비 중입니다.";
            }
            infoModal.style.display = 'flex';
        }

        function closeModal() {
            infoModal.style.display = 'none';
        }

        function randomizeGreenZone() {
            zoneGroupPos = Math.random() * 60;
            zoneGroup.style.left = zoneGroupPos + '%';
        }

        function resetPointerAndDirection() {
            if (zoneGroupPos > 30) {
                position = 0;
                direction = 1;
            } else {
                position = 100;
                direction = -1;
            }
            pointer.style.left = position + '%';
        }

        function shiftGreenZoneOnSuccess() {
            randomizeGreenZone();

            if (zoneGroupPos > 30) {
                position = 0;
                direction = 1;
            } else {
                position = 100;
                direction = -1;
            }
            pointer.style.left = position + '%';
        }

        function setupStage(stage) {
            currentStage = stage;
            targetSuccessCount = stage;
            currentSuccessCount = 0;

            gameTitle.textContent = `stage ${stage}`;
            gameDesc.innerHTML = `초록색 영역을 지나치기 전에 연속 <b>${targetSuccessCount}번</b> 맞춰야 합니다!`;

            speed = (0.35 + (stage - 1) * 0.015) * 1.15;

            zoneGroup.style.transition = 'none';
            randomizeGreenZone();
            void zoneGroup.offsetHeight;
            zoneGroup.style.transition = 'left 0.29s cubic-bezier(0.25, 1, 0.5, 1)';

            statusInfo.textContent = `속도: ${(speed * 10).toFixed(1)}x`;
            resultDisplay.textContent = `진행: 0 / ${targetSuccessCount}`;
            resultDisplay.style.color = "#ffffff";

            startBtn.style.display = 'inline-block';
            nextBtn.style.display = 'none';

            resetPointerAndDirection();
        }

        function isPointerInGreen() {
            const pointerRect = pointer.getBoundingClientRect();
            const greenRect = greenZone.getBoundingClientRect();
            const pointerCenter = pointerRect.left + pointerRect.width / 2;

            return pointerCenter >= greenRect.left && pointerCenter <= greenRect.right;
        }

        function isPointerPassed() {
            const pointerRect = pointer.getBoundingClientRect();
            const zoneGroupRect = zoneGroup.getBoundingClientRect();
            const pointerCenter = pointerRect.left + pointerRect.width / 2;

            if (direction === 1 && pointerCenter > zoneGroupRect.right) {
                return true;
            }
            if (direction === -1 && pointerCenter < zoneGroupRect.left) {
                return true;
            }
            return false;
        }

        function updateGame() {
            if (!isPlaying) return;

            position += speed * direction;

            if (position >= 100) {
                position = 100;
                direction = -1;
            } else if (position <= 0) {
                position = 0;
                direction = 1;
            }
            pointer.style.left = position + '%';

            if (isPointerPassed()) {
                triggerFail("지나침!");
                return;
            }
            
            animationFrameId = requestAnimationFrame(updateGame);
        }

        function startGame() {
            if (isPlaying) return;

            isPlaying = true;
            currentSuccessCount = 0;
            
            resetPointerAndDirection();

            resultDisplay.textContent = `진행: 0 / ${targetSuccessCount}`;
            resultDisplay.style.color = "#ffffff";
            startBtn.blur();

            animationFrameId = requestAnimationFrame(updateGame);
        }

        function nextStage() {
            if (currentStage < 50) {
                setupStage(currentStage + 1);
            } else {
                showStages();
            }
        }

        function triggerFail(reason = "") {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);

            const failText = reason ? `❌ FAIL! (${reason})` : `❌ FAIL! (${currentSuccessCount} / ${targetSuccessCount})`;
            resultDisplay.textContent = failText;
            resultDisplay.style.color = "#ff4d4d";
            
            startBtn.style.display = 'inline-block';
            startBtn.textContent = "RETRY";
        }

        function checkHit() {
            if (!isPlaying) return;

            if (isPointerInGreen()) {
                currentSuccessCount++;

                if (currentSuccessCount >= targetSuccessCount) {
                    isPlaying = false;
                    cancelAnimationFrame(animationFrameId);

                    resultDisplay.textContent = `🎉 STAGE ${currentStage} CLEAR!`;
                    resultDisplay.style.color = "#2ecc71";

                    if (currentStage + 1 > unlockedStage && currentStage < 50) {
                        unlockedStage = currentStage + 1;
                        localStorage.setItem('react_green_unlocked', unlockedStage.toString());
                    }

                    if (currentStage < 50) {
                        nextBtn.textContent = "NEXT STAGE";
                    } else {
                        nextBtn.textContent = "STAGE SELECT";
                    }
                    nextBtn.style.display = 'inline-block';
                    startBtn.style.display = 'none';
                } else {
                    resultDisplay.textContent = `👍 성공! (${currentSuccessCount} / ${targetSuccessCount})`;
                    resultDisplay.style.color = "#2ecc71";
                    
                    shiftGreenZoneOnSuccess();
                }
            } else {
                triggerFail();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (document.getElementById('gameScreen').classList.contains('active')) {
                    e.preventDefault();
                    if (isPlaying) {
                        checkHit();
                    } else if (nextBtn.style.display === 'inline-block') {
                        nextStage();
                    } else {
                        startBtn.textContent = "START";
                        startGame();
                    }
                }
            }
        });

        document.body.addEventListener('click', (e) => {
            if (document.getElementById('gameScreen').classList.contains('active')) {
                if (e.target.tagName === 'BUTTON') return;

                if (isPlaying) {
                    checkHit();
                }
            }
        });

        initStageGrid();
    </script>
</body>
</html>
